<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зарплата на заводе</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F3;--card:#FFFFFF;--ink:#14212B;--muted:#5A6772;--line:#DDE3E8;
  --accent:#1F5FBF;--accent-ink:#FFFFFF;--accent-soft:#E3EDFA;--accent-deep:#174A96;
  --warn:#A8430A;--warn-soft:#FBE9DD;
  --ui:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10171D;--card:#1A242D;--ink:#E8EEF2;--muted:#9AA8B4;--line:#2C3944;
    --accent:#6FA5F2;--accent-ink:#0B1B2E;--accent-soft:#1D3250;--accent-deep:#A9C9F7;
    --warn:#F0A070;--warn-soft:#3A2416;
  }
}
:root[data-theme="dark"]{
  --bg:#10171D;--card:#1A242D;--ink:#E8EEF2;--muted:#9AA8B4;--line:#2C3944;
  --accent:#6FA5F2;--accent-ink:#0B1B2E;--accent-soft:#1D3250;--accent-deep:#A9C9F7;
  --warn:#F0A070;--warn-soft:#3A2416;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--ui)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:12px 12px 96px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:16px;padding:16px}
.h{font-size:16px;font-weight:600;margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
.num{font-family:var(--num);font-weight:600;white-space:nowrap}

.month{display:flex;align-items:center;justify-content:space-between}
.month b{font-size:17px;font-weight:600}
.iconbtn{width:44px;height:44px;border:0;border-radius:12px;background:var(--card);font-size:20px}

.net{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:18px 20px}
.net .big{font:600 34px/1.15 var(--num);margin:4px 0 8px;white-space:nowrap}
.net .sub{display:flex;justify-content:space-between;gap:12px;font-size:13px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.day{min-height:52px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.day .d{font-size:14px;font-weight:600}
.day .l{font-size:10.5px;line-height:1.1}
.day.s{background:var(--accent-soft);border-color:var(--accent-soft)}
.day.t{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.a{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.day.o{border-style:dashed}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}

.btn{min-height:48px;border-radius:12px;border:1.5px solid var(--accent);background:var(--card);color:var(--accent-deep);font-weight:600;padding:0 16px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:var(--line);color:var(--ink);font-weight:500}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;font-size:14px}
.row.total{border-top:1px solid var(--line);font-weight:600;font-size:15px;margin-top:4px;padding-top:4px}
.row .ko{color:var(--muted)}
.sect{font-size:13px;font-weight:600;margin-bottom:4px}
.sect.plus{color:var(--accent-deep)}
.sect.minus{color:var(--warn)}

.field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-size:15px}
.field small{display:block;color:var(--muted);font-size:12px}
.field input[type=number],.field input[type=time],.field input[type=date],.field select{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px;max-width:160px;text-align:right}
.field input[type=number]{width:120px;font-family:var(--num)}
.field input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}

.note{border-radius:12px;padding:12px 14px;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--accent-soft);color:var(--accent-deep)}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stats div{flex:1;background:var(--bg);border-radius:12px;padding:10px 12px}
.stats small{display:block;color:var(--muted);font-size:12px}
.stats b{font:600 20px var(--num)}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:480px;margin:0 auto;display:flex}
.tabs button{flex:1;height:56px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500}
.tabs button[aria-selected=true]{color:var(--accent-deep);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}

dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:480px;border-radius:20px 20px 0 0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,30,.55)}
.sheet{padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--line);border-radius:10px;font-size:14px;text-align:center;padding:0 4px}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}

.net{display:block;width:100%;border:0;text-align:left;font:inherit}
.net .hint{display:block;margin-top:10px;font-size:13px;text-decoration:underline}
.month{gap:8px}
.month .mid{flex:1;display:flex;align-items:center;justify-content:space-between}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.choice{min-height:72px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);text-align:left;padding:12px 16px;width:100%}
.choice b{display:block;font-size:17px}
.choice span{color:var(--muted);font-size:13px}
.onb{display:flex;flex-direction:column;gap:12px;padding-top:24px}
.onb h1{font-size:24px;line-height:1.2;margin:0 0 4px}
.back{border:0;background:transparent;color:var(--accent-deep);font-weight:600;min-height:44px;padding:0 4px;text-align:left}
details.line>summary{list-style:none;cursor:pointer}
details.line>summary::-webkit-details-marker{display:none}
details.line p{margin:0 0 8px;color:var(--muted);font-size:13px}
details.more>summary{min-height:44px;display:flex;align-items:center;color:var(--accent-deep);font-weight:600;cursor:pointer}
.seg{grid-template-columns:repeat(2,1fr)}
.seg.three{grid-template-columns:repeat(3,1fr)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="app">
  <section id="onb" class="onb" hidden></section>
  <div class="month" id="monthbar">
    <div class="mid">
      <button class="iconbtn" aria-label="Предыдущий месяц" onclick="shift(-1)">‹</button>
      <b id="mname"></b>
      <button class="iconbtn" aria-label="Следующий месяц" onclick="shift(1)">›</button>
    </div>
    <button class="iconbtn" aria-label="Настройки" onclick="go('set')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>
    </button>
  </div>
  <section id="tab-cal"></section>
  <section id="tab-pay" hidden></section>
  <section id="tab-ext" hidden></section>
  <section id="tab-set" hidden></section>
</main>

<nav class="tabs" id="tabs"><div role="tablist">
  <button role="tab" data-t="cal" onclick="go('cal')">Смены</button>
  <button role="tab" data-t="ext" onclick="go('ext')">Выплаты</button>
</div></nav>

<dialog id="dlg" aria-labelledby="dlgt">
  <div class="sheet">
    <h2 class="h" id="dlgt" style="margin:0"></h2>
    <div class="seg" role="radiogroup" aria-label="Что было в этот день">
      <label><input type="radio" name="st" value="d" onchange="segChange(true)">Дневная смена</label>
      <label><input type="radio" name="st" value="n" onchange="segChange(true)">Ночная смена</label>
      <label><input type="radio" name="st" value="o" onchange="segChange(true)">Выходной</label>
      <label><input type="radio" name="st" value="a" onchange="segChange(true)">Пропуск</label>
    </div>
    <details class="more" id="other">
      <summary>Другое: простой, ёнча, праздник</summary>
      <div class="seg three">
        <label><input type="radio" name="st" value="i" onchange="segChange(true)">Простой 70%</label>
        <label><input type="radio" name="st" value="y" onchange="segChange(true)">Ёнча</label>
        <label><input type="radio" name="st" value="p" onchange="segChange(true)">Праздник</label>
      </div>
    </details>
    <div id="shiftf">
      <div class="field"><label for="fh">Тыкын<small>работа в выходной или праздник</small></label><input id="fh" type="checkbox"></div>
      <div class="field"><label for="fhrs">Оплачено часов<small>как в ведомости; пусто — посчитать по времени смены</small></label><input id="fhrs" type="number" min="0" max="24" step="0.5" inputmode="decimal" placeholder="авто"></div>
      <details class="more"><summary>Изменить время этой смены</summary>
        <div class="field"><label for="fa">Начало</label><input id="fa" type="time"></div>
        <div class="field"><label for="fb">Конец</label><input id="fb" type="time"></div>
        <div class="field"><label for="fbr">Перерывы, мин<small>не оплачиваются</small></label><input id="fbr" type="number" min="0" step="10" inputmode="numeric"></div>
      </details>
    </div>
    <button class="btn primary" onclick="saveDay()">Сохранить день</button>
    <div class="pair">
      <button class="btn quiet" onclick="removeDay()">Убрать отметку</button>
      <button class="btn quiet" onclick="document.getElementById('dlg').close()">Отмена</button>
    </div>
  </div>
</dialog>

<script>
var MIN_WAGE=10320;
var R={pension:0.0475,health:0.03595,care:0.1314,emp:0.009,free:0.033};
var MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var DEF={scheme:'ins',rate:10320,country:'RU',visa:'F-4',pension:true,emp:false,dStart:'08:00',dEnd:'20:00',dBreak:90,nStart:'20:00',nEnd:'08:00',nBreak:90,onboarded:false,pct:4,workDays:5,weekly:true,monthly:false,monthlyAmt:100000,bonusPct:0,startDate:''};
var KEY='zp-proto-v1';
function norm(o){var s=Object.assign({},DEF,o||{});if(o&&o.sStart){if(!o.dStart){s.dStart=o.sStart;s.dEnd=o.sEnd;s.dBreak=o.sBreak;}if(o.onboarded===undefined)s.onboarded=true;}return s;}
var st={s:Object.assign({},DEF),days:{},paid:{},tax:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);st.s=norm(p.s);st.days=p.days||{};st.paid=p.paid||{};st.tax=p.tax||{};}}catch(e){}
var tg=window.Telegram&&window.Telegram.WebApp;
var cloud=(tg&&tg.initData&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9'))?tg.CloudStorage:null;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}
  if(!cloud)return;
  var pre=ym()+'-',md={};
  Object.keys(st.days).forEach(function(key){if(key.indexOf(pre)===0)md[key.slice(8)]=st.days[key];});
  try{
    cloud.setItem('s',JSON.stringify(st.s));
    cloud.setItem('m',JSON.stringify({paid:st.paid,tax:st.tax}));
    if(Object.keys(md).length)cloud.setItem('d-'+ym(),JSON.stringify(md));else cloud.removeItem('d-'+ym());
  }catch(e){}
}
function cloudLoad(){
  if(!cloud)return;
  cloud.getKeys(function(err,keys){
    if(err||!keys||!keys.length)return;
    cloud.getItems(keys,function(err2,vals){
      if(err2||!vals)return;
      try{
        var days={};
        keys.forEach(function(key){
          var v=vals[key];if(!v)return;var o=JSON.parse(v);
          if(key==='s')st.s=norm(o);
          else if(key==='m'){st.paid=o.paid||{};st.tax=o.tax||{};}
          else if(key.indexOf('d-')===0)Object.keys(o).forEach(function(dd){days[key.slice(2)+'-'+dd]=o[dd];});
        });
        st.days=days;
        try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}
        render();
      }catch(e){}
    });
  });
}
function applyTheme(){
  if(!tg)return;
  var r=document.documentElement,p=tg.themeParams||{};
  if(tg.colorScheme)r.setAttribute('data-theme',tg.colorScheme);
  if(p.secondary_bg_color)r.style.setProperty('--bg',p.secondary_bg_color);
  if(p.bg_color)r.style.setProperty('--card',p.bg_color);
  if(p.text_color)r.style.setProperty('--ink',p.text_color);
  if(p.hint_color)r.style.setProperty('--muted',p.hint_color);
}

var now=new Date();
var view={y:now.getFullYear(),m:now.getMonth(),tab:'cal'};
var editKey=null;

function k(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ym(){return view.y+'-'+String(view.m+1).padStart(2,'0');}
function fmt(n){return Math.round(n).toLocaleString('ru-RU');}
function fh(h){return (Math.round(h*10)/10).toLocaleString('ru-RU');}
function mins(t){var a=String(t||'0:0').split(':');return (+a[0])*60+(+a[1]||0);}
function floor10(x){return Math.floor(x/10)*10;}

function shiftHours(rec){
  var a=mins(rec.a),b=mins(rec.b);if(b<=a)b+=1440;
  var paidMin=Math.max(0,b-a-(+rec.br||0));
  var wins=[[0,360],[1320,1800],[2760,3240]],night=0;
  wins.forEach(function(w){night+=Math.max(0,Math.min(b,w[1])-Math.max(a,w[0]));});
  if(rec.hrs!=null){var hp=Math.max(0,+rec.hrs||0);return {paid:hp,night:Math.min(night/60,hp)};}
  return {paid:paidMin/60,night:Math.min(night,paidMin)/60};
}

function autoAbs(d){var key=k(d);return (d.getDay()+6)%7<(+st.s.workDays||5)&&key<k(new Date())&&(!st.s.startDate||key>=st.s.startDate);}
function compute(y,m){
  var rate=+st.s.rate||0;
  var T={baseH:0,otH:0,nightH:0,t15:0,t20:0,idleD:0,leaveD:0,holD:0,abs:0,shifts:0,weeksOk:0,weeksLost:0};
  var first=new Date(y,m,1),last=new Date(y,m+1,0);
  var ws=new Date(y,m,1-((first.getDay()+6)%7));
  while(ws<=last){
    var weekReg=0,absent=false,worked=0;
    for(var i=0;i<7;i++){
      var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+i);
      var rec=st.days[k(d)];
      var inM=d.getMonth()===m&&d.getFullYear()===y;
      if(!rec){if(autoAbs(d)){absent=true;if(inM)T.abs++;}continue;}
      if(rec.t==='s'){
        var h=shiftHours(rec);worked+=h.paid;
        if(rec.h){
          var h15=Math.min(h.paid,8);
          if(inM){T.t15+=h15;T.t20+=h.paid-h15;}
        }else{
          var reg=Math.min(Math.min(h.paid,8),Math.max(0,40-weekReg));
          weekReg+=reg;
          if(inM){T.baseH+=reg;T.otH+=h.paid-reg;}
        }
        if(inM){T.nightH+=h.night;T.shifts++;}
      }else if(rec.t==='a'){absent=true;if(inM)T.abs++;}
      else if(rec.t==='i'){worked+=8;if(inM)T.idleD++;}
      else if(rec.t==='y'){worked+=8;if(inM)T.leaveD++;}
      else if(rec.t==='p'){if(inM)T.holD++;}
    }
    var sun=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6);
    if(st.s.weekly&&sun.getMonth()===m&&sun.getFullYear()===y){
      if(!absent&&worked>=15)T.weeksOk++;else if(absent)T.weeksLost++;
    }
    ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+7);
  }
  var L=[];
  function add(name,ko,amt,hint,ex){if(amt>0)L.push({name:name,ko:ko,amt:amt,hint:hint,ex:ex});}
  add('Основная оплата','기본급',T.baseH*rate,fh(T.baseH)+' ч','Обычные часы × ставка: до 8 часов в день и до 40 в неделю.');
  add('Переработка ×1,5','연장수당',T.otH*rate*1.5,fh(T.otH)+' ч','Часы сверх 8 в день или 40 в неделю оплачиваются в полуторном размере.');
  add('Ночные +0,5','야간수당',T.nightH*rate*0.5,fh(T.nightH)+' ч','За часы с 22:00 до 06:00 добавляется половина ставки.');
  add('Тыкын ×1,5 и ×2','휴일수당',(T.t15*1.5+T.t20*2)*rate,fh(T.t15+T.t20)+' ч','Работа в выходной или праздник: первые 8 часов ×1,5, дальше ×2.');
  add('Недельный бонус','주휴수당',T.weeksOk*8*rate,T.weeksOk+' нед.','Оплата 8 часов за каждую неделю без пропусков, если отработано не меньше 15 часов.');
  var mb=(st.s.monthly&&T.abs===0&&T.shifts>0)?(+st.s.monthlyAmt||0):0;
  add('Месячный бонус','만근수당',mb,'без пропусков','Выплачивается, если за месяц нет ни одного пропуска.');
  add('Ёнча','연차',T.leaveD*8*rate,T.leaveD+' дн.','Оплачиваемый день отпуска: 8 часов × ставка.');
  add('Праздники','유급휴일',T.holD*8*rate,T.holD+' дн.','Оплачиваемый государственный праздник: 8 часов × ставка.');
  add('Простой 70%','휴업수당',T.idleD*8*rate*0.7,T.idleD+' дн.','Смену отменили не по вашей вине: 70% от оплаты за 8 часов.');
  var gross=L.reduce(function(s,l){return s+l.amt;},0);
  var D=[];
  if(st.s.scheme==='pct'){
    D.push({name:'Удержание '+String(+st.s.pct||0).replace('.',',')+'%',ko:'공제',ex:'Процент, который удерживает ваш работодатель или фирма-посредник. Из чего он складывается, уточните у них.',amt:Math.round(gross*(+st.s.pct||0)/100)});
  }else if(st.s.scheme==='free'){
    D.push({name:'Налог 3,3%',ko:'사업소득세',ex:'Налог при оформлении как фрилансер. Часть можно вернуть через декларацию в мае.',amt:floor10(gross*R.free)});
  }else{
    if(st.s.pension)D.push({name:'Пенсия 4,75%',ko:'국민연금',ex:'Взнос в пенсионный фонд Кореи. Удерживают или нет, зависит от гражданства.',amt:floor10(gross*R.pension)});
    var health=floor10(gross*R.health);
    D.push({name:'Медстраховка 3,595%',ko:'건강보험',ex:'Обязательная медицинская страховка для официально устроенных.',amt:health});
    D.push({name:'Долгосрочный уход',ko:'장기요양',ex:'Добавка к медстраховке: 13,14% от её суммы.',amt:floor10(health*R.care)});
    if(st.s.emp)D.push({name:'Страхование занятости 0,9%',ko:'고용보험',ex:'Даёт право на пособие по безработице. Удерживают или нет, зависит от визы.',amt:floor10(gross*R.emp)});
    var tax=+st.tax[y+'-'+String(m+1).padStart(2,'0')]||0;
    if(tax>0)D.push({name:'Подоходный и местный налог',ko:'소득세',ex:'Сумма, которую вы ввели со своего листка.',amt:tax});
  }
  var ded=gross>0?D.reduce(function(s,l){return s+l.amt;},0):0;
  if(gross<=0)D=[];
  return {T:T,L:L,D:D,gross:gross,ded:ded,net:gross-ded,mbLost:st.s.monthly&&T.abs>0};
}

function tenure(){
  if(!st.s.startDate)return null;
  var s=new Date(st.s.startDate+'T00:00:00'),t=new Date();
  if(isNaN(s)||s>t)return null;
  var months=(t.getFullYear()-s.getFullYear())*12+(t.getMonth()-s.getMonth())-(t.getDate()<s.getDate()?1:0);
  var years=Math.floor(months/12);
  var days=Math.floor((t-s)/86400000);
  var ent,ps;
  if(years<1){ent=Math.min(months,11);ps=s;}
  else{ent=Math.min(25,15+Math.floor((years-1)/2));ps=new Date(s.getFullYear()+years,s.getMonth(),s.getDate());}
  var from=k(ps),used=0;
  Object.keys(st.days).forEach(function(key){if(st.days[key].t==='y'&&key>=from)used++;});
  return {months:months,years:years,days:days,ent:ent,used:used,left:Math.max(0,ent-used)};
}

function autoRules(){
  st.s.pension=!(st.s.country==='KZ'||(st.s.country==='UZ'&&st.s.visa==='E-9'));
  st.s.emp=['F-2','F-5','F-6'].indexOf(st.s.visa)>=0;
}

function val(id){return document.getElementById(id).value;}
function obScheme(v){st.s.scheme=v;obStep=v==='ins'?1:2;renderOnb();}
function obBack(){obStep=(obStep===2&&st.s.scheme!=='ins')?0:obStep-1;renderOnb();}
function obNext(){
  var s=st.s;
  if(obStep===1){s.country=val('o-c');s.visa=val('o-v');autoRules();}
  else if(obStep===2){s.rate=+val('o-r')||MIN_WAGE;if(s.scheme==='pct')s.pct=+String(val('o-p')).replace(',','.')||0;}
  else if(obStep===3){s.dStart=val('o-a')||'08:00';s.dEnd=val('o-b')||'20:00';s.dBreak=+val('o-br')||0;s.nStart=s.dEnd;s.nEnd=s.dStart;s.nBreak=s.dBreak;s.workDays=+val('o-wd')||5;}
  else{s.weekly=document.getElementById('o-w').checked;s.monthly=document.getElementById('o-m').checked;s.monthlyAmt=+val('o-ma')||0;s.onboarded=true;save();render();return;}
  obStep++;renderOnb();
}
function restartOnb(){st.s.onboarded=false;obStep=0;save();render();window.scrollTo(0,0);}

function render(){
  var ob=!st.s.onboarded;
  document.getElementById('onb').hidden=!ob;
  document.getElementById('tabs').hidden=ob;
  document.getElementById('monthbar').hidden=ob||view.tab==='set';
  ['cal','pay','ext','set'].forEach(function(t){document.getElementById('tab-'+t).hidden=ob||view.tab!==t;});
  try{if(tg&&tg.initData&&tg.BackButton){if(!ob&&(view.tab==='pay'||view.tab==='set'))tg.BackButton.show();else tg.BackButton.hide();}}catch(e){}
  if(ob){renderOnb();return;}
  var c=compute(view.y,view.m);
  document.getElementById('mname').textContent=MONTHS[view.m]+' '+view.y;
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',(b.dataset.t===view.tab||(b.dataset.t==='cal'&&view.tab==='pay'))?'true':'false');});
  if(view.tab==='cal')renderCal(c);
  else if(view.tab==='pay')renderPay(c);
  else if(view.tab==='ext')renderExt(c);
  else renderSet();
}

/* ---------- actions ---------- */
function go(t){view.tab=t;render();window.scrollTo(0,0);}
function shift(n){var d=new Date(view.y,view.m+n,1);view.y=d.getFullYear();view.m=d.getMonth();render();}
function setS(key,val,auto){
  if(key==='dBreak'||key==='nBreak'){var old=+st.s[key]||0,sa=key==='dBreak'?st.s.dStart:st.s.nStart,pre=ym()+'-';Object.keys(st.days).forEach(function(dk){var r=st.days[dk];if(dk.indexOf(pre)===0&&r.t==='s'&&r.a===sa&&(+r.br||0)===old)r.br=+val||0;});}
  st.s[key]=val;if(auto)autoRules();save();render();}
function setMonthVal(kind,val){var v=+val||0;if(v>0)st[kind][ym()]=v;else delete st[kind][ym()];save();render();}

function isWeekend(key){var p=key.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return (d.getDay()+6)%7>=(+st.s.workDays||5);}
function preset(kind){var s=st.s;return kind==='n'?{a:s.nStart,b:s.nEnd,br:+s.nBreak||0}:{a:s.dStart,b:s.dEnd,br:+s.dBreak||0};}
function quick(key,kind){var p=preset(kind);st.days[key]={t:'s',a:p.a,b:p.b,br:p.br,h:isWeekend(key)?1:0};save();render();}
function tapDay(key){if(st.days[key])openDay(key);else quick(key,'d');}
function curSt(){return (document.querySelector('input[name=st]:checked')||{}).value;}
function segChange(fill){
  var v=curSt(),sh=v==='d'||v==='n';
  document.getElementById('shiftf').hidden=!sh;
  if(sh&&fill){var p=preset(v);document.getElementById('fa').value=p.a;document.getElementById('fb').value=p.b;document.getElementById('fbr').value=p.br;}
}
function openDay(key){
  editKey=key;
  var rec=st.days[key],p=key.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
  document.getElementById('dlgt').textContent=d.getDate()+' '+MONTHS[d.getMonth()].toLowerCase()+', '+['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'][(d.getDay()+6)%7];
  var t=!rec?'d':rec.t==='s'?(rec.a===st.s.nStart&&rec.a!==st.s.dStart?'n':'d'):rec.t;
  document.querySelectorAll('input[name=st]').forEach(function(r){r.checked=r.value===t;});
  document.getElementById('other').open=t==='i'||t==='y'||t==='p';
  var pr=preset(t==='n'?'n':'d');
  document.getElementById('fa').value=rec&&rec.a||pr.a;
  document.getElementById('fb').value=rec&&rec.b||pr.b;
  document.getElementById('fbr').value=rec&&rec.br!=null?rec.br:pr.br;
  document.getElementById('fh').checked=rec&&rec.t==='s'?!!rec.h:isWeekend(key);
  document.getElementById('fhrs').value=rec&&rec.hrs!=null?rec.hrs:'';
  segChange(false);
  document.getElementById('dlg').showModal();
}
function saveDay(){
  var v=curSt()||'o';
  if(v==='d'||v==='n'){var p=preset(v);st.days[editKey]={t:'s',a:val('fa')||p.a,b:val('fb')||p.b,br:+val('fbr')||0,h:document.getElementById('fh').checked?1:0};var hv=String(val('fhrs')).replace(',','.');if(hv!==''&&!isNaN(+hv))st.days[editKey].hrs=+hv;}
  else st.days[editKey]={t:v};
  save();document.getElementById('dlg').close();render();
}
function removeDay(){delete st.days[editKey];save();document.getElementById('dlg').close();render();}
function fillWeek(){
  var n=new Date(view.y,view.m+1,0).getDate(),p=preset('d');
  for(var d=1;d<=n;d++){
    var dt=new Date(view.y,view.m,d),key=k(dt);
    if((dt.getDay()+6)%7<5&&!st.days[key])st.days[key]={t:'s',a:p.a,b:p.b,br:p.br,h:0};
  }
  save();render();
}
function clearMonth(){
  var pre=ym()+'-';
  Object.keys(st.days).forEach(function(key){if(key.indexOf(pre)===0)delete st.days[key];});
  save();go('cal');
}
function resetAll(){
  st={s:Object.assign({},DEF),days:{},paid:{},tax:{}};obStep=0;view.tab='cal';
  try{localStorage.removeItem(KEY);}catch(e){}
  if(cloud)cloud.getKeys(function(e,keys){if(!e&&keys&&keys.length)cloud.removeItems(keys);});
  render();
}
if(tg){
  try{tg.ready();tg.expand();}catch(e){}
  if(tg.initData){applyTheme();try{tg.onEvent('themeChanged',applyTheme);tg.BackButton.onClick(function(){go('cal');});}catch(e){}}
}
render();
cloudLoad();
</script>
</body>
</html>
